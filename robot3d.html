<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سند الروبوت — صفحة تجربة</title>
<style>
  :root { --bg: #eef3f8; --line: #dbe3ec; --ink: #1f2937; --cy: #0891b2; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Tahoma, 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: #0f172a; color: #fff; padding: 14px 18px; }
  header h1 { margin: 0; font-size: 19px; }
  main { display: grid; grid-template-columns: minmax(280px, 460px) 1fr; gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }
  .stage { background: radial-gradient(circle at 50% 35%, #fff, #dfe8f1); border: 1px solid var(--line); border-radius: 18px; height: 560px; position: relative; overflow: hidden; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #f8fafc; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button.on { background: var(--cy); color: #fff; border-color: var(--cy); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } .stage { height: 440px; } }
</style>
</head>
<body>
<header><h1>سند الروبوت ثلاثي الأبعاد — صفحة تجربة</h1></header>
<main>
  <div class="stage" id="stage"></div>
  <div class="panel"><h3>الحركات</h3><div class="grid" id="acts"></div><h3>تعبيرات الوجه</h3><div class="grid" id="faces"></div></div>
</main>
<script src="vendor/three.min.js"></script>
<script src="js/robot3d-build.js"></script>
<script src="js/robot3d-moves.js"></script>
<script src="js/robot3d.js"></script>
<script>
  const stage = document.getElementById('stage');
  const bot = window.SadenRobot && SadenRobot.create(stage, { auto: false, snapshot: true });
  window.bot = bot;
  if (bot) {
    const btn = (box, name, fn) => { const b = document.createElement('button'); b.textContent = name; b.onclick = fn; box.appendChild(b); };
    bot.actions.forEach((a) => btn(document.getElementById('acts'), a, () => bot.play(a)));
    bot.faces.forEach((f) => btn(document.getElementById('faces'), f, () => bot.face(f)));
    let drag = null;
    stage.addEventListener('pointerdown', (e) => { drag = e.clientX; });
    addEventListener('pointerup', () => { drag = null; });
    addEventListener('pointermove', (e) => { if (drag != null) { bot.spin((e.clientX - drag) * 0.01); drag = e.clientX; } else bot.lookAt(e.clientX, e.clientY); });
  } else stage.textContent = 'المتصفح لا يدعم WebGL';
</script>
</body>
</html>
